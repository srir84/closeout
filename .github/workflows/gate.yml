name: gate
# Trusted check: runs main's copy of this workflow and tools/gate.py, reads the PR diff through the API,
# and never checks out or runs the pull request's code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - run: python3 tools/gate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOSEOUT_PRIVATE_NAMES: ${{ secrets.CLOSEOUT_PRIVATE_NAMES }}
