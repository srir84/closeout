name: nightly
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_PYTHON: "3.13"
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - name: Mutation gate and the weak-suite proof
        run: |
          uv run python tools/mutation_gate.py
          uv run python tools/mutation_gate.py --prove-weak
      - name: Every test, more Hypothesis examples
        env: { HYPOTHESIS_PROFILE: nightly }
        run: |
          make up
          uv run pytest -q -m "not live" --durations=25
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: nightly-results, path: test-results/ }
