name: pages
on:
  push:
    branches: [main]
    paths: ["pages/**", "docs/demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: The mock and the demo video only
        run: |
          mkdir -p site
          cp pages/closeout-prototype.html site/index.html
          cp pages/demo.html site/demo.html
          cp docs/demo/closeout-demo.mp4 docs/demo/closeout-demo-poster.png site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
