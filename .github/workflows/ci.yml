name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_PYTHON: "3.13"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The pull request's own commits, not GitHub's test merge commit (which carries the
          # account's email address and never reaches main: merges are rebase-only).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests tools data evals
      - run: uv run ruff format --check src tests tools data evals
      - run: uv run pyright
      - name: Publish check (the gate check scans fork pull requests, which get no secrets)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: uv run python tools/publish_check.py --history
        env:
          CLOSEOUT_PRIVATE_NAMES: ${{ secrets.CLOSEOUT_PRIVATE_NAMES }}

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Fast tests (unit, property, arch, config, workflow, replay, integration)
        run: uv run pytest -q -m "not stack and not live and not slow" --durations=15
      - name: Coverage of core/ (line + branch, at least 90%)
        run: uv run pytest -q tests/unit tests/property --cov=closeout.core --cov-branch --cov-report=term --cov-fail-under=90 -p no:randomly
      - name: Mutation gate on core/
        run: uv run python tools/mutation_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: trace-fast, path: build/trace/ }

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: make up
      - name: Stack, chaos and browser tests
        run: uv run pytest -q -m "stack and not live" --durations=15 --video=retain-on-failure --output=test-results/videos
      - if: always()
        run: docker compose -f deploy/compose.yaml logs --no-color > test-results/compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: stack-results, path: test-results/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: trace-stack, path: build/trace/ }

  trace:
    needs: [tests, stack]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: results }
      - run: mkdir -p build/trace && cp results/trace-*/*.jsonl build/trace/
      - shell: bash
        run: |
          set -o pipefail
          python3 tools/trace.py | tee -a "$GITHUB_STEP_SUMMARY"

  # E5 / R-RUN-1: a fresh copy with only Docker and make runs the whole demo in replay mode in under
  # 10 minutes and prints its pass/fail list. No uv, no Python on the host.
  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: make demo (timed)
        env: { CI: "1" }
        run: |
          start=$(date +%s)
          make demo
          took=$(( $(date +%s) - start ))
          echo "make demo took ${took} s"
          test "$took" -le 600
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: demo-report, path: build/demo-report.txt }
