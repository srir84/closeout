[project]
name = "closeout"
version = "0.1.0"
description = "Verified home-repair records (demo). Made-up people only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "temporalio>=1.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "pillow>=10.4",
    "pypdfium2>=4.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "testcontainers[postgres]>=4.7",
    "syrupy>=4.6",
    "pytest-playwright>=0.5",
    "mutmut>=3.2",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "aiosmtpd>=1.4",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "pyshp>=3.1.9",
    "pyproj>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/closeout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "req(id): spec requirement this test proves",
    "slice(id): implementation slice this test belongs to",
    "stack: needs the full docker compose stack (make up)",
    "live: needs a live local model (owner's Mac)",
    "slow: nightly only",
]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning:testcontainers.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ"]
ignore = ["S101", "S311", "E501", "S608", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]
"conftest.py" = ["S", "DTZ", "E402"]
# Document generators: one-off drawing scripts, style rules relaxed.
"evals/generators/**" = ["S", "DTZ", "B905", "E741", "E731", "B007", "UP031"]
"tools/**" = ["S"]
"data/**" = ["S", "DTZ"]
"evals/**" = ["S", "DTZ"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.mutmut]
source_paths = ["src/closeout/core/"]
pytest_add_cli_args_test_selection = ["tests/unit/", "tests/property/"]
also_copy = ["tests/", "src/", "conftest.py"]
pytest_add_cli_args = ["-q", "-x", "-p", "no:randomly", "-m", "not stack and not live"]

[tool.coverage.run]
branch = true
source = ["src/closeout"]
