<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Clickable mock of the Closeout product: contractor, homeowner, sale report, agent runs, ops and roadmap views. All people and jobs are sample data.">
<title>Closeout Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@600&display=swap">
<style>
/* Layout: app shell (sticky top bar + view area). Contractor = sub-nav + work area; Homeowner = phone + home record side by side; Agent = runs list + run detail; Ops = card grid. Redlines (gaps) are architect-style magenta markup over the UI. */
:root{
  --bg:#eef2f3; --panel:#ffffff; --panel2:#f6f8f9; --fg:#15202b; --muted:#5a6874; --rule:#d8dfe4;
  --accent:#1f7a4d; --accent-fg:#ffffff; --accent-soft:#e2f1e8;
  --warn:#9c520d; --warn-soft:#fbeedd; --danger:#b42318; --danger-soft:#fde8e6; --info:#245b8f; --info-soft:#e3eef8;
  --redline:#c2185b; --redline-fg:#ffffff; --redline-soft:#fce4ee;
  --map-land:#e5ebe2; --map-water:#cde0ec; --map-street:#ffffff; --map-edge:#c9d3c4;
  --paper:#fbf8f0; --paper-ink:#262626; --paper-rule:#ddd6c6; --hl:#ffe98a;
  --roof:#1f7a4d; --wall:#f3efe6; --trim:#5a6874;
  --shadow:0 1px 2px rgba(16,24,32,.06),0 8px 24px rgba(16,24,32,.08);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1317; --panel:#161d23; --panel2:#1b242b; --fg:#e3e9ee; --muted:#95a3af; --rule:#2a353e;
  --accent:#55c08b; --accent-fg:#0b1a12; --accent-soft:#173426;
  --warn:#e6a15f; --warn-soft:#362614; --danger:#f08a80; --danger-soft:#3a1a17; --info:#8cbfe9; --info-soft:#15283a;
  --redline:#f06292; --redline-fg:#1a0710; --redline-soft:#3a1626;
  --map-land:#1c2520; --map-water:#13283a; --map-street:#2e3c35; --map-edge:#2a3a31;
  --roof:#55c08b; --wall:#2a333a; --trim:#95a3af;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1317; --panel:#161d23; --panel2:#1b242b; --fg:#e3e9ee; --muted:#95a3af; --rule:#2a353e;
  --accent:#55c08b; --accent-fg:#0b1a12; --accent-soft:#173426;
  --warn:#e6a15f; --warn-soft:#362614; --danger:#f08a80; --danger-soft:#3a1a17; --info:#8cbfe9; --info-soft:#15283a;
  --redline:#f06292; --redline-fg:#1a0710; --redline-soft:#3a1626;
  --map-land:#1c2520; --map-water:#13283a; --map-street:#2e3c35; --map-edge:#2a3a31;
  --roof:#55c08b; --wall:#2a333a; --trim:#95a3af;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:800;letter-spacing:-.015em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
h4{font-size:.92rem;font-weight:700}
p{margin:8px 0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ic{width:1.05em;height:1.05em;flex:none;vertical-align:-.15em}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:12px}
.wrap{max-width:1240px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--rule);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.top-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.brand svg{width:26px;height:26px}
.sample{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:3px;font-weight:500}
.tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.tab{border:0;background:none;padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:500;display:flex;gap:7px;align-items:center}
.tab:hover{background:var(--panel2);color:var(--fg)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.top-actions{display:flex;gap:8px}
.btn{border:1px solid var(--rule);background:var(--panel);padding:8px 14px;border-radius:6px;font-weight:500;display:inline-flex;gap:7px;align-items:center;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.redline{border-color:var(--redline);color:var(--redline)}
.btn.redline[aria-pressed="true"]{background:var(--redline);color:var(--redline-fg)}
.btn .count{font-family:var(--f-mono);font-size:.78rem;background:var(--redline-soft);color:var(--redline);padding:0 6px;border-radius:99px}
.btn.redline[aria-pressed="true"] .count{background:var(--redline-fg);color:var(--redline)}

/* tour bar */
.tour{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH,58px));z-index:15;margin:12px auto 0;max-width:1240px;background:var(--fg);color:var(--bg);border-radius:8px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;box-shadow:var(--shadow)}
.tour .tstep{font-family:var(--f-mono);font-size:.75rem;opacity:.75;white-space:nowrap}
.tour .ttext{flex:1;min-width:220px}
.tour .ttext b{display:block;font-family:var(--f-display);font-size:1rem}
.tour .ttext span{font-size:.9rem;opacity:.85}
.tour .btn{background:transparent;border-color:color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg)}
.tour .btn.primary{background:var(--bg);color:var(--fg);border-color:var(--bg)}
.tour-dots{display:flex;gap:4px}
.tour-dots i{width:6px;height:6px;border-radius:50%;background:var(--bg);opacity:.3}
.tour-dots i.on{opacity:1}

main{max-width:1240px;margin:18px auto 0}

/* generic surfaces */
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px}
.card.flat{box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:500;padding:2px 9px;border-radius:99px;white-space:nowrap;line-height:1.5}
.chip-accent{background:var(--accent-soft);color:var(--accent)}
.chip-warn{background:var(--warn-soft);color:var(--warn)}
.chip-danger{background:var(--danger-soft);color:var(--danger)}
.chip-info{background:var(--info-soft);color:var(--info)}
.chip-neutral{background:var(--panel2);color:var(--muted);border:1px solid var(--rule)}
.chip-real{background:var(--info-soft);color:var(--info);font-family:var(--f-mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase}
.mark{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.72rem;border:1.5px solid var(--accent);color:var(--accent);padding:1px 8px;border-radius:99px;white-space:nowrap}
.mark.off{border-style:dashed;border-color:var(--rule);color:var(--muted)}
.marks{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.callout{border-radius:8px;padding:12px 14px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start}
.callout > div{min-width:0}
.callout.danger{background:var(--danger-soft);color:var(--fg)}
.callout.danger .ic{color:var(--danger)}
.callout.info{background:var(--info-soft)}
.callout.info .ic{color:var(--info)}
.callout.warn{background:var(--warn-soft)}
.callout.warn .ic{color:var(--warn)}
.callout.ok{background:var(--accent-soft)}
.callout.ok .ic{color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
input[type=text],input[type=email],input[type=date],select{border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:7px 10px;min-width:0;max-width:100%}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;cursor:pointer}
label.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
label.opt input{margin-top:3px}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--panel2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* overview */
.ov-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;padding:12px 0 8px}
.ov-hero p{font-size:1.05rem;max-width:60ch}
.personas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:22px}
.persona{display:grid;gap:10px;align-content:start}
.persona .who{display:flex;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}
.av-m{background:var(--warn-soft);color:var(--warn)}
.av-d{background:var(--info-soft);color:var(--info)}
.av-p{background:var(--accent-soft);color:var(--accent)}
.persona dl{margin:0;display:grid;gap:6px;font-size:.9rem}
.persona dt{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.persona dd{margin:0}
.journey{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;counter-reset:j}
.journey li{counter-increment:j;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px;display:grid;gap:6px;align-content:start;position:relative}
.journey li::before{content:counter(j);font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.journey .actor{font-size:.78rem;color:var(--muted);display:flex;gap:5px;align-items:center}
.journey b{font-family:var(--f-display)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:30px 0 4px}

/* contractor */
.split{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
.subnav{display:grid;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH,58px) + 16px)}
.subnav button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:6px;display:flex;gap:9px;align-items:center;color:var(--muted);font-weight:500}
.subnav button:hover{background:var(--panel)}
.subnav button[aria-current="page"]{background:var(--panel);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.subnav .who{padding:4px 12px 12px;display:flex;gap:10px;align-items:center}
.subnav .who .avatar{width:34px;height:34px;font-size:.85rem}
.page-h{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.page-h > div{min-width:0}
.sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.source{border:1px solid var(--rule);border-radius:10px;padding:12px;background:var(--panel);display:grid;gap:4px;text-align:left}
.source.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.source .ic{width:22px;height:22px;color:var(--muted)}
.source.sel .ic{color:var(--accent)}
.drop{border:2px dashed var(--rule);border-radius:12px;padding:28px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;background:var(--panel)}
.stackpapers{position:relative;width:120px;height:110px}
.stackpapers i{position:absolute;width:78px;height:98px;background:var(--paper);border:1px solid var(--paper-rule);border-radius:3px;box-shadow:var(--shadow)}
.stackpapers i::before{content:"";position:absolute;left:10px;right:10px;top:14px;height:40px;background:repeating-linear-gradient(var(--paper-rule) 0 2px,transparent 2px 9px)}
.stackpapers i:nth-child(1){left:0;top:8px;transform:rotate(-8deg)}
.stackpapers i:nth-child(2){left:20px;top:4px;transform:rotate(3deg)}
.stackpapers i:nth-child(3){left:38px;top:10px;transform:rotate(10deg)}
.summary{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.thumb{width:30px;height:38px;background:var(--paper);border:1px solid var(--paper-rule);border-radius:2px;flex:none;position:relative}
.thumb::before{content:"";position:absolute;left:5px;right:5px;top:7px;height:18px;background:repeating-linear-gradient(var(--paper-rule) 0 2px,transparent 2px 6px)}
.jobcell{display:flex;gap:10px;align-items:center;min-width:0}
.jobcell b{display:block;font-weight:600}
.actionbar{position:sticky;bottom:0;margin-top:14px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.profile-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.stat{background:var(--panel2);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.map{width:100%;height:auto;border-radius:10px;border:1px solid var(--rule);display:block;max-width:100%}
.map .land{fill:var(--map-land)}
.map .water{fill:var(--map-water)}
.map .street{stroke:var(--map-street);stroke-width:5;fill:none}
.map .street.s{stroke-width:3}
.map .edge{fill:none;stroke:var(--map-edge);stroke-width:1}
.map .pin-ok{fill:var(--accent)}
.map .pin-wait{fill:var(--muted)}
.map .pin-ring{fill:var(--panel)}
.map text{font-family:var(--f-mono);font-size:9px;fill:var(--muted)}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:var(--shadow);
  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px}
.drawer-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.drawer-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1000px,calc(100% - 24px));max-height:calc(100% - 32px);overflow-y:auto;background:var(--bg);border-radius:12px;box-shadow:var(--shadow);padding:20px}
.modal-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.close{border:0;background:var(--panel);border-radius:6px;padding:6px;display:grid;place-items:center}

/* invoice paper */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-rule);border-radius:4px;padding:22px 22px 26px;font-size:.85rem;box-shadow:var(--shadow);transform:rotate(-.4deg);position:relative}
.paper .ph{border-bottom:2px solid var(--paper-ink);padding-bottom:8px;margin-bottom:12px;display:grid}
.paper .ph b{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.04em}
.paper .ph span{font-size:.72rem;opacity:.7}
.paper .pmeta{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;font-family:var(--f-mono);font-size:.78rem}
.paper table{font-size:.8rem;margin:12px 0}
.paper th{background:none;color:var(--paper-ink);border-color:var(--paper-rule);padding:5px 4px;opacity:.7}
.paper td{border-color:var(--paper-rule);padding:5px 4px}
.paper .ptotal{display:flex;justify-content:flex-end;gap:16px;font-weight:600;font-size:.95rem}
.paper .pnote{margin-top:10px;font-size:.78rem;opacity:.85}
.ev{border-radius:2px;transition:background .15s, box-shadow .15s}
.ev.on{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
.scrawl{font-family:var(--f-hand);font-size:1.2rem;line-height:1}
.hidden-text{margin-top:12px;font-size:.72rem;color:var(--danger);border:1px dashed var(--danger);padding:6px 8px;border-radius:3px;background:color-mix(in srgb,var(--danger-soft) 60%,transparent)}
.fields{display:grid;gap:6px}
.field{display:grid;grid-template-columns:90px minmax(0,1fr) 90px;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--rule)}
.field:hover,.field:focus-within{border-color:var(--info)}
.field .lab{font-size:.78rem;color:var(--muted)}
.field .val{font-weight:500;overflow-wrap:anywhere}
.conf{display:grid;gap:3px;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);text-align:right}
.conf i{display:block;height:4px;border-radius:2px;background:var(--rule);position:relative;overflow:hidden}
.conf i b{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.conf.low i b{background:var(--warn)}
.cands{display:grid;gap:6px}
.cand{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--panel);font-size:.88rem}
.cand.pick{border-color:var(--accent)}
.cand.no{opacity:.65}
.cand > div{min-width:0}

/* email template */
.email{background:var(--panel);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.email .eh{padding:12px 16px;border-bottom:1px solid var(--rule);font-size:.85rem;display:grid;gap:2px}
.email .eb{padding:16px;font-size:.92rem}
.fill{background:var(--info-soft);color:var(--info);border-radius:3px;padding:0 3px;font-weight:500}
.fill.reg{background:var(--accent-soft);color:var(--accent)}
.ebtns{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.ebtns span{padding:8px 12px;border-radius:6px;border:1px solid var(--rule);font-size:.85rem;font-weight:500}
.ebtns span:first-child{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.efoot{font-size:.74rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px;margin-top:12px}
.rcpt{display:grid;gap:6px;max-height:420px;overflow-y:auto}

.sbody{flex:1;overflow-y:auto;padding:8px 18px 18px;display:grid;gap:12px;align-content:start;font-size:.9rem}
.mailitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 4px;border-bottom:1px solid var(--rule);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}

.bigbtn{width:100%;justify-content:center;padding:12px;font-size:.95rem}
.house{width:100%;height:auto;display:block;max-width:100%}
.house .sky{fill:var(--panel2)}
.house .ground{fill:var(--map-land)}
.house .wall{fill:var(--wall);stroke:var(--trim);stroke-width:1.5}
.house .roof{fill:var(--roof)}
.house .roof-old{fill:var(--trim)}
.house .win{fill:var(--info-soft);stroke:var(--trim);stroke-width:1.5}
.house .door{fill:var(--trim)}
.house .tree{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.house .trunk{fill:var(--trim)}
.house .chim{fill:var(--wall);stroke:var(--trim);stroke-width:1.5}
.house .sun-wall{fill:var(--wall);stroke:var(--trim);stroke-width:1.5}
.house .sun-roof{fill:var(--trim)}
.house .sun-glass{fill:var(--info-soft);stroke:var(--trim);stroke-width:1}

.house .sun-done .sun-wall{stroke:var(--roof);stroke-width:2.5}
.house .sun-done .sun-roof{fill:var(--roof)}
.house .badge{fill:var(--roof)}
.house .badge-check{fill:none;stroke:var(--accent-fg);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.record-head{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:center}

.htabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.timeline{list-style:none;padding:0;margin:0;display:grid;gap:0}

.timeline .when{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);padding-top:14px;text-align:right}
.timeline .rail{position:relative;height:100%;min-height:60px}
.timeline .rail::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--rule)}
.timeline .rail i{position:absolute;left:4px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--muted)}
.timeline .rail i.ok{border-color:var(--accent);background:var(--accent)}
.timeline .rail i.town{border-color:var(--info)}
.timeline .rail i.wait{border-color:var(--warn)}
.titem{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin:6px 0;display:grid;gap:6px}
.titem .th{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:flex-start}
.titem .th > div{min-width:0}
.agentcard{border:1px solid var(--rule);border-left:4px solid var(--info);background:var(--panel);border-radius:10px;padding:14px;display:grid;gap:10px}
.progress{display:flex;gap:3px}
.progress i{flex:1;height:5px;border-radius:2px;background:var(--rule)}
.progress i.d{background:var(--accent)}
.progress i.a{background:var(--info)}
.why{background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:.88rem}

/* agent view */
.agent{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.runs{display:grid;gap:6px}
.run{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:10px 12px;text-align:left;display:grid;gap:3px}

/* ops */
.ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

.queue{display:grid;gap:8px}
.qitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--panel)}

.qn{font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}

.tile b{font-family:var(--f-display);font-size:1.35rem}
.tile span{font-size:.8rem;color:var(--muted)}

/* redlines */
[data-gap]{position:relative}
body.redlines [data-gap]{outline:2px dashed var(--redline);outline-offset:3px;border-radius:6px}
.rl-pin{position:absolute;top:-12px;right:-10px;z-index:5;width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);background:var(--redline);color:var(--redline-fg);font:700 .72rem/1 var(--f-mono);display:grid;place-items:center;box-shadow:var(--shadow);padding:0}
.rl-pin:hover{transform:scale(1.12)}

  padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) 18px}

.gap{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:grid;gap:6px;margin-bottom:10px}
.gap.sel{border-color:var(--redline);box-shadow:inset 3px 0 0 var(--redline)}
.gap .gh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}

.gap dl{margin:0;display:grid;gap:4px;font-size:.86rem}
.gap dt{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gap dd{margin:0 0 4px}
.scope{font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:3px;white-space:nowrap}

.av-t{background:var(--redline-soft);color:var(--redline)}
.loop{list-style:none;padding:0;margin:12px 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}

.lic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);color:var(--muted)}
.loop li.now .lic{background:var(--accent-soft);color:var(--accent)}
.phase{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--rule);padding:2px 7px;border-radius:3px;white-space:nowrap}

.rep{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.rep-h{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.report .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}

.phases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.phasecard{display:grid;gap:8px;align-content:start}
.phasecard.now{border-color:var(--accent)}
.pdl{margin:0;display:grid;gap:3px;font-size:.88rem}
.pdl dt{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.pdl dd{margin:0}
.mini{border:1px dashed var(--rule);border-radius:10px;padding:12px;background:var(--panel2);display:grid;gap:6px;font-size:.88rem}
.phone-mini{max-width:320px}
.mrow{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.mtable{font-size:.84rem;background:none}

@media (max-width:960px){.rep,.phases{grid-template-columns:minmax(0,1fr)}.loop{grid-template-columns:repeat(2,minmax(0,1fr))}.loop li::after{display:none}}

function jobState(j){
 if(!S.imported) return 'none';
 const st=S.stage[j.id]||0;
 if(st<4) return 'processing';
 if(j.issue==='condo'&&!S.fix.condo) return 'needs';
 if(j.issue==='lowconf'&&!S.fix.lowconf) return 'needs';
 if(j.issue==='nocontact'&&!S.fix.contact) return 'needs';
 return 'ready';
}
function reqStatus(j){
 if(!S.sentIds.has(j.id)) return null;
 if(j.id==='j1'){
  if(S.undone) return 'retracted';
  if(S.decision==='confirmed') return 'confirmed';
  if(S.decision==='corrected') return 'corrected';
  if(S.decision==='disputed') return 'declined';
  return S.phone!=='inbox'?'opened':'sent';
 }
 return {j2:'reminder',j3:'opened',j4:'confirmed',j5:'sent',j6:'confirmed',j7:'declined',j8:'sent'}[j.id];
}
function parcelOf(j){ if(j.issue==='condo') return S.fix.condo?'Block 12 · Lot 9 · '+S.unit:null; return j.parcel; }
function marks(j){
 const r=reqStatus(j);
 return {attested:S.imported, confirmed:r==='confirmed', permit:!!(j.permit&&parcelOf(j))};
}
function markHTML(j,showOff){
 const m=marks(j);let h='';
 h+= m.confirmed?`<span class="mark">${ic('check')}client-confirmed</span>`:(showOff?`<span class="mark off">client-confirmed</span>`:'');
 h+= m.attested?`<span class="mark">${ic('check')}contractor-attested</span>`:'';
 h+= m.permit?`<span class="mark">${ic('check')}permit-corroborated</span>`:'';
 return `<span class="marks">${h}</span>`;
}

  <div class="tiles" style="margin-top:10px">
   <div class="tile"><span>Wrong facts published per 100 closeouts</span><b>&lt; 0.5</b><span>headline metric</span></div>
   <div class="tile"><span>Jobs needing a person</span><b>&lt; 25%</b><span>read next to the line above</span></div>
   <div class="tile"><span>Injection attacks that worked</span><b>0 of 25</b><span>bounds the rate at about 12% or less; grow the suite</span></div>
   <div class="tile"><span>Cost per verified record</span><b>measure</b><span>local model vs hosted, week 3</span></div>
  </div>
  <div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Eval gate in CI</th><th>Result</th><th>Why</th></tr></thead><tbody>
   <tr><td>PR #14 · shorter extraction prompt</td><td><span class="chip chip-danger">${ic('x')}blocked</span></td><td class="small">Field accuracy fell below the 95% gate on the golden set (illustrative)</td></tr>
   <tr><td>PR #13 · permit picker abstains on ties</td><td><span class="chip chip-accent">${ic('check')}passed</span></td><td class="small">False corroboration down, no new unauthorized tool calls (illustrative)</td></tr>
  </tbody></table></div></div>
 </div>`;
}

/* ---------- redline panel ---------- */
function rlPanel(){
 const list=GAPS.filter(g=>S.rlFilter==='all'||g.scope===S.rlFilter||(S.rlFilter==='top'&&g.top));
 const mvp=GAPS.filter(g=>g.scope==='mvp').length;
 return `<aside class="rlpanel" role="dialog" aria-label="What the plan is missing">
  <div class="drawer-h"><div><div class="eyebrow">Redlines</div><h2>What the plan is missing</h2></div><button class="close" data-act="redlines-close" type="button" aria-label="Close">${ic('x')}</button></div>
  <p class="small">Walking the product as each user found ${GAPS.length} things the build plan didn't cover. ${mvp} belong in the MVP; the rest can wait. Click a pin on any screen, or "Show me" here.</p>
  <div class="rlfilter">${[['all','All'],['top','Most serious'],['mvp','MVP'],['later','Later']].map(f=>`<button type="button" data-act="rl-filter" data-f="${f[0]}" aria-pressed="${S.rlFilter===f[0]}">${f[1]}</button>`).join('')}</div>
  ${list.map(g=>`<div class="gap ${S.rlSel===g.id?'sel':''}" id="gap-${g.id}"><div class="gh"><span class="gn">${GAPS.indexOf(g)+1}</span><div><b>${esc(g.title)}</b>${g.top?'<div class="top5">would embarrass the demo</div>':''}</div><span class="scope ${g.scope}">${g.scope==='mvp'?'MVP':'Later'}</span></div>
   <dl><dt>Where it bites</dt><dd>${esc(g.bite)}</dd><dt>Fix</dt><dd>${esc(g.fix)}</dd></dl>
   <div><button class="btn sm redline" data-act="rl-go" data-g="${g.id}" type="button">${ic('eye')}Show me</button></div></div>`).join('')}
 </aside>`;
}
function placePins(){
 if(!S.redlines) return;
 document.querySelectorAll('[data-gap]').forEach(el=>{
  const g=GAPS.find(x=>x.id===el.dataset.gap); if(!g) return;
  if(el.querySelector(':scope > .rl-pin')) return;
  const b=document.createElement('button');b.type='button';b.className='rl-pin';b.dataset.act='rl-open';b.dataset.g=g.id;
  b.textContent=GAPS.indexOf(g)+1;b.setAttribute('aria-label','Redline '+(GAPS.indexOf(g)+1)+': '+g.title);
  if(el.tagName==='TR'){const td=el.lastElementChild;td.style.position='relative';td.appendChild(b);} else el.appendChild(b);
 });
}

/* ---------- tour ---------- */
const TOUR=[
 {t:'Mike imports three years of invoices',d:'The agent reads each one, finds the home and any town permit. Nothing is sent.',run:()=>{go('contractor');S.ctab='import';S.drawer=null;S.modal=null;startImport();}},
 {t:'One job needs Mike: a condo with six units',d:'The permit feed has no unit numbers, so the agent abstains instead of guessing.',run:()=>{ensureImported();go('contractor');S.ctab='import';S.modal=null;S.drawer='j3';}},
 {t:'Every field points back to the invoice',d:'Hover a field to see its source. The permit was picked from candidates, with the rejected one shown.',run:()=>{ensureImported(true);go('contractor');S.ctab='import';S.modal=null;S.drawer='j1';}},
 {t:'Mike approves the exact emails',d:'A fixed template, values from the invoice and registry, sending rules, and a signed approval.',run:()=>{ensureImported(true);go('contractor');S.ctab='import';S.drawer=null;S.modal=readyJobs().length?'outreach':null;}},
 {t:'Dana gets one email on her phone',d:'No account, no sign-up wall. She can confirm, correct or say no.',run:()=>{ensureSent();S.modal=null;S.drawer=null;go('homeowner');S.phone='email';S.decision=null;S.undone=false;}},
 {t:'Dana answers in one tap',d:'She is confirming as the person who was billed. Ownership is verified separately.',run:()=>{ensureSent();go('homeowner');S.phone='confirm';}},
 {t:'Dana decides what the public sees',d:'Price and papers are private by default.',run:()=>{ensureSent();go('homeowner');S.phone='visibility';}},
 {t:'The record now carries three marks',d:'Client-confirmed, contractor-attested, permit-corroborated. Then Dana is invited to claim her home.',run:()=>{ensureSent();if(S.decision!=='confirmed'){S.undone=false;confirmJob();}go('homeowner');S.phone='done';S.htab='timeline';}},
 {t:'A worker crashes mid-send',d:'Temporal resumes from history. The outbox checks the mail log, so Dana gets one email, not two.',run:()=>{ensureSent();go('agent');S.run='r2';S.crash='idle';setTimeout(runCrash,300);}},
 {t:'A poisoned invoice tries to hijack the agent',d:'Even a fully compromised planner is stopped by the permission gateway, and a replayed approval fails.',run:()=>{go('agent');S.run='r5';if(!S.injection)runInjection();}},
 {t:'Priya handles what the agent will not guess',d:'Real Manasquan join numbers, a review queue, and quality targets that gate every change.',run:()=>{go('ops');}},
 {t:"Mike's profile, verified",d:'Only confirmed jobs appear. Declines and silence stay private.',run:()=>{ensureSent();if(S.decision!=='confirmed'){confirmJob();}go('contractor');S.ctab='profile';}},
 {t:'Dana lists the house: a sale-ready report',d:'Verified work, warranties and permits in one page. One permit from before she owned the home has no final approval in state data.',run:()=>{ensureSent();if(S.decision!=='confirmed'){confirmJob();}go('report');S.townReq='idle';S.reportPreview=false;}},
 {t:'The agent asks the borough instead of guessing',d:'It drafts a records request, Dana approves it, and the workflow waits days for the reply. The answer is attached with its source.',run:()=>{go('report');S.townReq='sent';S.reportPreview=false;}},
 {t:'Tom, the buyer\'s agent, sees the shared report',d:'Prices, invoices and contacts stay hidden. The permit question is already answered.',run:()=>{go('report');S.townReq='replied';S.reportPreview=true;S.shareRole="buyer's agent";}},
 {t:'Where it goes next',d:'Maintain, Find and Hire plug into the same engine. Each phase has a gate before we build it.',run:()=>{go('roadmap');}}
];
function tourBar(){
 if(S.tour<0) return '';
 const s=TOUR[S.tour];
 return `<div class="tour" role="region" aria-label="Walkthrough"><span class="tstep">Step ${S.tour+1} of ${TOUR.length}</span><div class="ttext"><b>${s.t}</b><span>${s.d}</span></div>
 <div class="tour-dots" aria-hidden="true">${TOUR.map((_,i)=>`<i class="${i<=S.tour?'on':''}"></i>`).join('')}</div>
 <div class="row"><button class="btn sm" data-act="tour-prev" type="button" ${S.tour===0?'disabled':''}>${ic('left')}Back</button><button class="btn sm primary" data-act="tour-next" type="button">${S.tour===TOUR.length-1?'Finish':'Next'}${ic('right')}</button><button class="btn sm" data-act="tour-end" type="button" aria-label="Exit walkthrough">${ic('x')}</button></div></div>`;
}

/* ---------- render ---------- */
const VIEWS=[['overview','home','Overview'],['contractor','wrench','Contractor'],['homeowner','phone','Homeowner'],['report','file','Sale report'],['agent','activity','Agent activity'],['ops','flag','Operations'],['roadmap','trend','Full loop']];
function render(){
 document.getElementById('tabs').innerHTML=VIEWS.map(v=>`<button class="tab" role="tab" type="button" data-act="go" data-v="${v[0]}" aria-selected="${S.view===v[0]}">${ic(v[1])}<span class="tlabel">${v[2]}</span></button>`).join('');
 document.getElementById('tourBtn').innerHTML=`${ic('play')}${S.tour>=0?'Walkthrough on':'Walkthrough'}`;
 const rb=document.getElementById('rlBtn');rb.innerHTML=`${ic('bulb')}Redlines <span class="count">${GAPS.length}</span>`;rb.setAttribute('aria-pressed',S.redlines);
 document.body.classList.toggle('redlines',S.redlines);
 document.getElementById('tourbar').innerHTML=tourBar();
 document.getElementById('view').innerHTML={overview:vOverview,contractor:vContractor,homeowner:vHomeowner,report:vReport,agent:vAgent,ops:vOps,roadmap:vRoadmap}[S.view]();
 let ov='';
 if(S.drawer&&S.view==='contractor') ov=drawerJob(J(S.drawer));
 else if(S.modal==='outreach'&&S.view==='contractor') ov=modalOutreach();
 document.getElementById('overlay').innerHTML=ov;
 document.getElementById('rl').innerHTML=S.rlPanel?rlPanel():'';
 placePins();
 const top=document.getElementById('top');document.documentElement.style.setProperty('--topH',top.offsetHeight+'px');
}
let toastT;
function toast(msg){const t=document.getElementById('toast');t.innerHTML=`<div class="toast" role="status">${ic('check')}${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>t.innerHTML='',3200);}
function flashGap(g){
 requestAnimationFrame(()=>{const el=document.querySelector(`[data-gap="${g.id}"]`);if(!el)return;el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),3000);});
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]'); if(!t) return;
 const a=t.dataset.act;
 switch(a){
  case 'go': S.drawer=null;S.modal=null;go(t.dataset.v);break;
  case 'ctab': S.ctab=t.dataset.t;break;
  case 'import': startImport();return;
  case 'open-job': S.drawer=t.dataset.id;break;
  case 'close-overlay': S.drawer=null;S.modal=null;S.attestErr=false;break;
  case 'fix':{const k=t.dataset.k;S.fix[k]=true;
    const msg={condo:'Unit '+S.unit+' saved. This job is ready.',lowconf:'Date saved. This job is ready.',contact:'Contact added. This job is ready.'}[k];
    log('Mike',{condo:'Picked unit '+S.unit+' for 220 Dune Ave.',lowconf:'Confirmed the date for 88 Tidewater Rd.',contact:'Added a client email for 42 Brine Pl.'}[k],'owner_reply kind=correction field='+k);toast(msg);break;}
  case 'unit': S.unit=t.value;break;
  case 'open-outreach': S.modal='outreach';S.attestErr=false;break;
  case 'preview': S.previewJob=t.dataset.id;break;
  case 'approve':{const at=document.getElementById('attest');if(!at||!at.checked){S.attestErr=true;break;}
    const ids=readyJobs().filter(j=>{const c=document.getElementById('r-'+j.id);return !c||c.checked;}).map(j=>j.id);
    sendOutreach(ids);S.modal=null;S.attestErr=false;S.ctab='requests';toast(ids.length+' emails approved and queued. Approval ap_7Q2 signed.');break;}
  case 'quick-send': ensureSent();toast('Imported, fixed and sent the sample batch.');break;
  case 'pub-preview': S.publicPreview=t.checked;break;
  case 'autonomy': S.autonomy=t.value;toast('Saved.');break;
  case 'phone': S.phone=t.dataset.s;break;
  case 'ho-yes': S.phone='visibility';break;
  case 'cost-public': S.costPublic=t.checked;break;
  case 'ho-confirm': S.undone=false;confirmJob();break;
  case 'ho-correct': S.decision='corrected';S.phone='done';log('Dana','Sent a correction: finished Oct 3, also new gutters. Waiting for Mike to accept.','attestation corrected job=j1 diff=[date,work]');break;
  case 'ho-claim': S.claimed=true;log('Dana','Claimed 14 Osprey Ln. Ownership not yet verified.','claim property=b48-l12 verified=false');toast('Home claimed. Verify ownership later with a mailed code.');break;
  case 'ho-reset': S.phone='inbox';S.decision=null;S.undone=false;S.costPublic=false;break;
  case 'buyer': S.buyer=t.checked;break;
  case 'htab': S.htab=t.dataset.t;break;
  case 'why': S.whyOpen=!S.whyOpen;break;
  case 'hvac-pause': S.hvacPaused=!S.hvacPaused;log('Dana',S.hvacPaused?'Paused the HVAC closeout. Reminder held.':'Resumed the HVAC closeout.','signal '+(S.hvacPaused?'pause':'resume')+' workflow=closeout-b48-l12-hvac');break;
  case 'run': S.run=t.dataset.r;break;
  case 'go-run': S.drawer=null;S.modal=null;S.run=t.dataset.r;go('agent');break;
  case 'crash': runCrash();return;
  case 'inject': runInjection();break;
  case 'undo': S.undone=true;log('Mike','Undid the publish for 14 Osprey Ln. A retraction was added; history is kept.','RetractRecordWorkflow event=e_312 retracts=e_311');toast('Retracted. The sent email cannot be unsent.');break;
  case 'raw': S.rawAudit=t.checked;break;
  case 'town-draft': S.townReq='drafted';log('Agent','Drafted a records request to the borough about permit 22-0187 for Dana to review.','BoroughRecordsWorkflow draft permit=22-0187 template=opra_status');break;
  case 'town-send': S.townReq='sent';log('Dana','Approved the records request exactly as drafted.','approval ap_9K4 recipient=construction_office single_use=true');log('Agent','Sent the request. Waiting up to 7 business days; one reminder on day 8.','outbox send idem=wf:send:22-0187 timer=7bd');break;
  case 'town-reply': S.townReq='replied';log('Agent','Read the borough\'s reply: final inspection passed Aug 9, 2022. Updated the report after Dana accepted.','quarantine read reply=borough_22-0187 extracted={final:2022-08-09}; owner accepted');break;
  case 'share-role': S.shareRole=t.dataset.r;break;
  case 'report-preview': S.reportPreview=t.checked;break;
  case 'quick-confirm': ensureSent();if(S.decision!=='confirmed'){S.undone=false;confirmJob();}toast('Dana confirmed the sunroom addition.');break;
  case 'toast': toast(t.dataset.msg);return;
  case 'tour-start': S.tour=0;TOUR[0].run();break;
  case 'tour-next': if(S.tour>=TOUR.length-1){S.tour=-1;toast('Walkthrough done. Turn on Redlines to see what the plan is missing.');}else{S.tour++;TOUR[S.tour].run();}window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});break;
  case 'tour-prev': if(S.tour>0){S.tour--;TOUR[S.tour].run();}break;
  case 'tour-end': S.tour=-1;break;
  case 'redlines-toggle': S.redlines=!S.redlines;S.rlPanel=S.redlines;break;
  case 'redlines-open': S.redlines=true;S.rlPanel=true;break;
  case 'redlines-close': S.rlPanel=false;break;
  case 'rl-filter': S.rlFilter=t.dataset.f;break;
  case 'rl-open': e.stopPropagation();S.rlPanel=true;S.rlSel=t.dataset.g;S.rlFilter='all';render();requestAnimationFrame(()=>{const c=document.getElementById('gap-'+t.dataset.g);if(c)c.scrollIntoView({block:'center'});});return;
  case 'rl-go':{const g=GAPS.find(x=>x.id===t.dataset.g);S.redlines=true;S.rlSel=g.id;S.drawer=null;S.modal=null;g.go();if(window.innerWidth<900)S.rlPanel=false;render();flashGap(g);return;}
  default: return;
 }
 render();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){ if(S.drawer||S.modal){S.drawer=null;S.modal=null;render();} else if(S.rlPanel){S.rlPanel=false;render();} }
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-act]')){e.preventDefault();e.target.click();}
});
function hl(f,on){document.querySelectorAll('.paper .ev[data-f="'+f+'"]').forEach(x=>x.classList.toggle('on',on));}
document.addEventListener('mouseover',e=>{const f=e.target.closest('[data-hf]');document.querySelectorAll('.paper .ev.on').forEach(x=>x.classList.remove('on'));if(f)hl(f.dataset.hf,true);});
document.addEventListener('focusin',e=>{const f=e.target.closest('[data-hf]');if(f){document.querySelectorAll('.paper .ev.on').forEach(x=>x.classList.remove('on'));hl(f.dataset.hf,true);}});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.some(x=>x[0]===v)&&v!==S.view){S.view=v;S.drawer=null;S.modal=null;render();}});
window.addEventListener('resize',()=>{const top=document.getElementById('top');document.documentElement.style.setProperty('--topH',top.offsetHeight+'px');});
const h0=location.hash.slice(1); if(VIEWS.some(x=>x[0]===h0)) S.view=h0;
render();
})();
</script>

</html>
